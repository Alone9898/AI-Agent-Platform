name: xingyao-cloud

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xingyao
      POSTGRES_USER: xingyao
      POSTGRES_PASSWORD: xingyao_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xingyao -d xingyao"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["xingyao-migrate", "-direction", "up"]
    environment:
      POSTGRES_DSN: postgres://xingyao:xingyao_dev_password@postgres:5432/xingyao?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      POSTGRES_DSN: postgres://xingyao:xingyao_dev_password@postgres:5432/xingyao?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: replace-this-with-at-least-32-random-characters
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
